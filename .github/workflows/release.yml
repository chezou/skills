name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate and package
        run: |
          python3 scripts/validate-skills.py
          python3 scripts/package-skills.py

      # gh skill and npx skills read release tags for version pinning and
      # update checks; the zips serve the plain-file install route.
      #
      # Cutting the tag from the GitHub UI publishes the release before this
      # job runs, so create it only when it is missing and attach the zips
      # either way — otherwise that route ends with an asset-less release and
      # a red build.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes
          fi
